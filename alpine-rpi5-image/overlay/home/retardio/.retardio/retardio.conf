# Retardio Node Configuration
# Pre-configured for Alpine Linux on RPi5 (4GB)

# Network (change to 'main' for mainnet)
chain=regtest

# RPC Settings
server=1
rpcuser=retardiorpc
rpcpassword=CHANGE_THIS_ON_FIRST_BOOT
rpcallowip=127.0.0.1
rpcport=22555

# Performance (optimized for 4GB RAM + Alpine)
dbcache=384
maxmempool=75
maxconnections=32

# Network
listen=1
port=22556

# Logging
debug=0
printtoconsole=0
shrinkdebugfile=1

# Minimal resource usage
par=2
