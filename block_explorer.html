<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retardio Block Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            color: #333;
            font-size: 2em;
            font-weight: bold;
        }

        .search-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .search-box h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .search-input {
            display: flex;
            gap: 10px;
        }

        .search-input input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
        }

        .search-input button {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }

        .search-input button:hover {
            background: #764ba2;
        }

        .block-list {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .block-list h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .block-item {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.3s;
        }

        .block-item:hover {
            background: #f5f5f5;
        }

        .block-item:last-child {
            border-bottom: none;
        }

        .block-height {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .block-hash {
            color: #666;
            font-family: monospace;
            font-size: 0.9em;
            word-break: break-all;
        }

        .block-time {
            color: #999;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .block-detail {
            background: #f9f9f9;
            padding: 20px;
            margin-top: 15px;
            border-radius: 10px;
            display: none;
        }

        .block-detail.active {
            display: block;
        }

        .detail-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: bold;
            color: #667eea;
            min-width: 150px;
        }

        .detail-value {
            color: #333;
            font-family: monospace;
            word-break: break-all;
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Retardio Block Explorer</h1>
            <p>Explore the Retardio blockchain</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Current Height</h3>
                <div class="value" id="blockHeight">Loading...</div>
            </div>
            <div class="stat-card">
                <h3>Difficulty</h3>
                <div class="value" id="difficulty">Loading...</div>
            </div>
            <div class="stat-card">
                <h3>Network Hash Rate</h3>
                <div class="value" id="hashrate">N/A</div>
            </div>
            <div class="stat-card">
                <h3>Chain Work</h3>
                <div class="value" id="chainwork">Loading...</div>
            </div>
        </div>

        <div class="search-box">
            <h2>Search</h2>
            <div class="search-input">
                <input type="text" id="searchInput" placeholder="Enter block height or hash...">
                <button onclick="searchBlock()">Search</button>
            </div>
            <div id="searchError"></div>
        </div>

        <div class="block-list">
            <h2>Recent Blocks</h2>
            <div id="blockList">
                <div class="loading">Loading blocks...</div>
            </div>
        </div>
    </div>

    <script>
        const RPC_URL = 'http://127.0.0.1:18332';
        const RPC_USER = '';
        const RPC_PASS = '';

        async function rpcCall(method, params = []) {
            const response = await fetch(RPC_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    jsonrpc: '1.0',
                    id: 'explorer',
                    method: method,
                    params: params
                })
            });

            const data = await response.json();
            if (data.error) {
                throw new Error(data.error.message);
            }
            return data.result;
        }

        async function loadStats() {
            try {
                const info = await rpcCall('getblockchaininfo');
                document.getElementById('blockHeight').textContent = info.blocks.toLocaleString();
                document.getElementById('difficulty').textContent = info.difficulty.toFixed(8);
                document.getElementById('chainwork').textContent = info.chainwork.substring(0, 16) + '...';
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadRecentBlocks() {
            try {
                const height = await rpcCall('getblockcount');
                const blockList = document.getElementById('blockList');
                blockList.innerHTML = '';

                for (let i = 0; i < 10; i++) {
                    const blockHeight = height - i;
                    if (blockHeight < 0) break;

                    const hash = await rpcCall('getblockhash', [blockHeight]);
                    const block = await rpcCall('getblock', [hash, 1]);

                    const blockItem = document.createElement('div');
                    blockItem.className = 'block-item';
                    blockItem.innerHTML = `
                        <div class="block-height">Block #${blockHeight}</div>
                        <div class="block-hash">Hash: ${block.hash}</div>
                        <div class="block-time">Time: ${new Date(block.time * 1000).toLocaleString()} | ${block.nTx} transactions</div>
                        <div class="block-detail" id="detail-${blockHeight}">
                            <div class="detail-row">
                                <div class="detail-label">Height:</div>
                                <div class="detail-value">${block.height}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Hash:</div>
                                <div class="detail-value">${block.hash}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Previous Hash:</div>
                                <div class="detail-value">${block.previousblockhash || 'Genesis Block'}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Merkle Root:</div>
                                <div class="detail-value">${block.merkleroot}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Timestamp:</div>
                                <div class="detail-value">${new Date(block.time * 1000).toLocaleString()}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Difficulty:</div>
                                <div class="detail-value">${block.difficulty}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Nonce:</div>
                                <div class="detail-value">${block.nonce}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Size:</div>
                                <div class="detail-value">${block.size} bytes</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Transactions:</div>
                                <div class="detail-value">${block.nTx}</div>
                            </div>
                        </div>
                    `;

                    blockItem.onclick = () => toggleBlockDetail(blockHeight);
                    blockList.appendChild(blockItem);
                }
            } catch (error) {
                document.getElementById('blockList').innerHTML = `
                    <div class="error">
                        Error loading blocks: ${error.message}<br><br>
                        Make sure your Retardio node is running with RPC enabled on port 18332.
                    </div>
                `;
            }
        }

        function toggleBlockDetail(height) {
            const detail = document.getElementById(`detail-${height}`);
            detail.classList.toggle('active');
        }

        async function searchBlock() {
            const input = document.getElementById('searchInput').value.trim();
            const errorDiv = document.getElementById('searchError');
            errorDiv.innerHTML = '';

            if (!input) {
                errorDiv.innerHTML = '<div class="error">Please enter a block height or hash</div>';
                return;
            }

            try {
                let hash;
                if (/^\d+$/.test(input)) {
                    // Search by height
                    hash = await rpcCall('getblockhash', [parseInt(input)]);
                } else {
                    // Search by hash
                    hash = input;
                }

                const block = await rpcCall('getblock', [hash, 1]);

                // Display block details
                const blockList = document.getElementById('blockList');
                blockList.innerHTML = `
                    <div class="block-item">
                        <div class="block-height">Block #${block.height}</div>
                        <div class="block-hash">Hash: ${block.hash}</div>
                        <div class="block-time">Time: ${new Date(block.time * 1000).toLocaleString()} | ${block.nTx} transactions</div>
                        <div class="block-detail active">
                            <div class="detail-row">
                                <div class="detail-label">Height:</div>
                                <div class="detail-value">${block.height}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Hash:</div>
                                <div class="detail-value">${block.hash}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Previous Hash:</div>
                                <div class="detail-value">${block.previousblockhash || 'Genesis Block'}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Merkle Root:</div>
                                <div class="detail-value">${block.merkleroot}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Timestamp:</div>
                                <div class="detail-value">${new Date(block.time * 1000).toLocaleString()}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Difficulty:</div>
                                <div class="detail-value">${block.difficulty}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Nonce:</div>
                                <div class="detail-value">${block.nonce}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Size:</div>
                                <div class="detail-value">${block.size} bytes</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Transactions:</div>
                                <div class="detail-value">${block.tx.join('<br>')}</div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                errorDiv.innerHTML = `<div class="error">Block not found: ${error.message}</div>`;
            }
        }

        // Load data on page load
        loadStats();
        loadRecentBlocks();

        // Refresh every 10 seconds
        setInterval(() => {
            loadStats();
            loadRecentBlocks();
        }, 10000);

        // Allow Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchBlock();
        });
    </script>
</body>
</html>
