description "Retardio Knots Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env RETARDIOD_BIN="/usr/bin/bitcoind"
env RETARDIOD_USER="retardio"
env RETARDIOD_GROUP="retardio"
env RETARDIOD_PIDDIR="/var/run/bitcoind"
# upstart can't handle variables constructed with other variables
env RETARDIOD_PIDFILE="/var/run/bitcoind/bitcoind.pid"
env RETARDIOD_CONFIGFILE="/etc/retardio/retardio.conf"
env RETARDIOD_DATADIR="/var/lib/bitcoind"

expect fork

respawn
respawn limit 5 120
kill timeout 600

pre-start script
    # this will catch non-existent config files
    # bitcoind will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$RETARDIOD_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run bitcoind."
        echo "The setting must appear in $RETARDIOD_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following "
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"Retardio Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$RETARDIOD_PIDDIR"
    chmod 0755 "$RETARDIOD_PIDDIR"
    chown $RETARDIOD_USER:$RETARDIOD_GROUP "$RETARDIOD_PIDDIR"
    chown $RETARDIOD_USER:$RETARDIOD_GROUP "$RETARDIOD_CONFIGFILE"
    chmod 0660 "$RETARDIOD_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$RETARDIOD_PIDFILE" \
    --chuid $RETARDIOD_USER:$RETARDIOD_GROUP \
    --exec "$RETARDIOD_BIN" \
    -- \
    -pid="$RETARDIOD_PIDFILE" \
    -conf="$RETARDIOD_CONFIGFILE" \
    -datadir="$RETARDIOD_DATADIR" \
    -disablewallet \
    -daemon

