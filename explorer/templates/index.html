<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retardio Block Explorer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        a { color: #00d4ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 30px 0; border-bottom: 2px solid #00d4ff; }
        .logo { font-size: 2.5rem; font-weight: bold; color: #00d4ff; text-align: center; }
        .logo span { color: #ff6b6b; }
        .search-box { max-width: 700px; margin: 20px auto 0; display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 15px 20px; border: 2px solid #333; border-radius: 8px; background: #1a1a2e; color: #fff; font-size: 1rem; }
        .search-box input:focus { outline: none; border-color: #00d4ff; }
        .search-box button { padding: 15px 30px; background: #00d4ff; color: #0a0a0f; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .search-box button:hover { background: #00b8e6; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
        .stat-card { background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%); padding: 25px; border-radius: 12px; text-align: center; border: 1px solid #333; }
        .stat-card h3 { color: #888; font-size: 0.9rem; margin-bottom: 10px; text-transform: uppercase; }
        .stat-card .value { font-size: 1.8rem; font-weight: bold; color: #00d4ff; }
        .section { background: #1a1a2e; border-radius: 12px; margin: 20px 0; overflow: hidden; border: 1px solid #333; }
        .section-header { background: #0f3460; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .section-header h2 { font-size: 1.2rem; }
        .section-header a { font-size: 0.9rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #16213e; color: #888; font-size: 0.85rem; text-transform: uppercase; }
        tr:hover { background: #16213e; }
        .hash { font-family: monospace; font-size: 0.85rem; }
        .hash-short { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
        .time-ago { color: #888; font-size: 0.9rem; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; }
        .badge-green { background: #1a4d2e; color: #4ade80; }
        .badge-blue { background: #1e3a5f; color: #60a5fa; }
        .nodes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; padding: 20px; }
        .node-card { background: #16213e; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .node-status { width: 10px; height: 10px; border-radius: 50%; }
        .node-status.online { background: #4ade80; }
        .node-status.offline { background: #f87171; }
        .detail-page { padding: 20px; }
        .detail-header { margin-bottom: 20px; }
        .detail-header h1 { font-size: 1.5rem; margin-bottom: 10px; }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .detail-item { background: #16213e; padding: 15px; border-radius: 8px; }
        .detail-item label { color: #888; font-size: 0.85rem; display: block; margin-bottom: 5px; }
        .detail-item .value { word-break: break-all; font-family: monospace; }
        .loading { text-align: center; padding: 50px; color: #888; }
        .error { background: #3d1a1a; color: #f87171; padding: 20px; border-radius: 8px; text-align: center; }
        footer { text-align: center; padding: 30px; color: #666; border-top: 1px solid #333; margin-top: 50px; }
        @media (max-width: 768px) {
            .hash-short { max-width: 80px; }
            th, td { padding: 10px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">RETARDIO<span>SCAN</span></div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by Block Height, Block Hash, Transaction ID, or Address">
                <button onclick="search()">Search</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="mainContent">
            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <h3>Block Height</h3>
                    <div class="value" id="statHeight">-</div>
                </div>
                <div class="stat-card">
                    <h3>Difficulty</h3>
                    <div class="value" id="statDifficulty">-</div>
                </div>
                <div class="stat-card">
                    <h3>Active Nodes</h3>
                    <div class="value" id="statNodes">-</div>
                </div>
                <div class="stat-card">
                    <h3>Total Transactions</h3>
                    <div class="value" id="statTx">-</div>
                </div>
            </div>

            <!-- Recent Blocks -->
            <div class="section">
                <div class="section-header">
                    <h2>Recent Blocks</h2>
                    <a href="#" onclick="showAllBlocks(); return false;">View All</a>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Height</th>
                            <th>Hash</th>
                            <th>Transactions</th>
                            <th>Size</th>
                            <th>Reward</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="blocksTable">
                        <tr><td colspan="6" class="loading">Loading blocks...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Network Nodes -->
            <div class="section">
                <div class="section-header">
                    <h2>Network Nodes</h2>
                    <a href="#" onclick="showRegisterNode(); return false;">Register Node</a>
                </div>
                <div class="nodes-grid" id="nodesGrid">
                    <div class="loading">Loading nodes...</div>
                </div>
            </div>
        </div>

        <div id="detailContent" style="display: none;"></div>
    </main>

    <footer>
        <p>Retardio Block Explorer - Connecting to the entire Retardio network</p>
        <p style="margin-top: 10px;"><a href="#" onclick="showHome(); return false;">Home</a></p>
    </footer>

    <script>
        // Auto-detect base path for when running behind a reverse proxy
        const basePath = window.location.pathname.replace(/\/$/, '');
        const API = basePath.includes('/explorer') ? '/explorer' : '';

        async function fetchAPI(endpoint) {
            try {
                const res = await fetch(API + endpoint);
                return await res.json();
            } catch (e) {
                console.error('API Error:', e);
                return null;
            }
        }

        function timeAgo(timestamp) {
            const seconds = Math.floor(Date.now() / 1000 - timestamp);
            if (seconds < 60) return seconds + 's ago';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
            return Math.floor(seconds / 86400) + 'd ago';
        }

        function formatNumber(num) {
            if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
            return num.toFixed(2);
        }

        async function loadStats() {
            const data = await fetchAPI('/api/status');
            if (data && !data.error) {
                document.getElementById('statHeight').textContent = data.blocks?.toLocaleString() || '-';
                document.getElementById('statDifficulty').textContent = formatNumber(data.difficulty || 0);
                document.getElementById('statNodes').textContent = data.nodes || '-';
            }
            const blocks = await fetchAPI('/api/blocks?limit=1');
            if (blocks?.blocks) {
                let txCount = 0;
                blocks.blocks.forEach(b => txCount += b.tx_count || 0);
                document.getElementById('statTx').textContent = txCount.toLocaleString();
            }
        }

        async function loadBlocks() {
            const data = await fetchAPI('/api/blocks?limit=10');
            const tbody = document.getElementById('blocksTable');
            if (!data?.blocks?.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">No blocks found</td></tr>';
                return;
            }
            tbody.innerHTML = data.blocks.map(b => `
                <tr onclick="showBlock(${b.height})" style="cursor:pointer">
                    <td><span class="badge badge-blue">${b.height}</span></td>
                    <td class="hash"><span class="hash-short">${b.hash}</span></td>
                    <td>${b.tx_count}</td>
                    <td>${(b.size / 1024).toFixed(2)} KB</td>
                    <td>${b.reward?.toFixed(8) || '0'} RET</td>
                    <td class="time-ago">${timeAgo(b.timestamp)}</td>
                </tr>
            `).join('');
        }

        async function loadNodes() {
            const data = await fetchAPI('/api/nodes');
            const grid = document.getElementById('nodesGrid');
            if (!data?.nodes?.length) {
                grid.innerHTML = '<div class="loading">No nodes registered yet</div>';
                return;
            }
            grid.innerHTML = data.nodes.map(n => `
                <div class="node-card">
                    <div>
                        <div style="font-weight:bold">${n.host}:${n.port}</div>
                        <div style="color:#888;font-size:0.9rem">Height: ${n.height?.toLocaleString() || 'Unknown'}</div>
                    </div>
                    <div class="node-status ${n.active ? 'online' : 'offline'}"></div>
                </div>
            `).join('');
        }

        async function search() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            const data = await fetchAPI('/api/search?q=' + encodeURIComponent(query));
            if (data?.error) {
                alert('Not found');
                return;
            }
            if (data.type === 'block') showBlock(data.height);
            else if (data.type === 'tx') showTransaction(data.txid);
            else if (data.type === 'address') showAddress(data.address);
        }

        async function showBlock(height) {
            const data = await fetchAPI('/api/block/' + height);
            if (!data || data.error) {
                alert('Block not found');
                return;
            }
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('detailContent').style.display = 'block';
            document.getElementById('detailContent').innerHTML = `
                <div class="detail-page">
                    <div class="detail-header">
                        <h1>Block #${data.height}</h1>
                    </div>
                    <div class="detail-grid">
                        <div class="detail-item"><label>Block Hash</label><div class="value">${data.hash}</div></div>
                        <div class="detail-item"><label>Previous Hash</label><div class="value">${data.prev_hash || 'Genesis'}</div></div>
                        <div class="detail-item"><label>Timestamp</label><div class="value">${new Date(data.timestamp * 1000).toLocaleString()}</div></div>
                        <div class="detail-item"><label>Difficulty</label><div class="value">${data.difficulty}</div></div>
                        <div class="detail-item"><label>Nonce</label><div class="value">${data.nonce}</div></div>
                        <div class="detail-item"><label>Size</label><div class="value">${(data.size / 1024).toFixed(2)} KB</div></div>
                        <div class="detail-item"><label>Transactions</label><div class="value">${data.tx_count}</div></div>
                        <div class="detail-item"><label>Block Reward</label><div class="value">${data.reward?.toFixed(8) || '0'} RET</div></div>
                    </div>
                    <div class="section" style="margin-top:20px">
                        <div class="section-header"><h2>Transactions (${data.transactions?.length || 0})</h2></div>
                        <table>
                            <thead><tr><th>TxID</th><th>Type</th><th>Amount</th></tr></thead>
                            <tbody>
                                ${(data.transactions || []).map(tx => `
                                    <tr onclick="showTransaction('${tx.txid}')" style="cursor:pointer">
                                        <td class="hash"><span class="hash-short">${tx.txid}</span></td>
                                        <td><span class="badge ${tx.is_coinbase ? 'badge-green' : 'badge-blue'}">${tx.is_coinbase ? 'Coinbase' : 'Transfer'}</span></td>
                                        <td>${tx.total_output?.toFixed(8) || '0'} RET</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        async function showTransaction(txid) {
            const data = await fetchAPI('/api/tx/' + txid);
            if (!data || data.error) {
                alert('Transaction not found');
                return;
            }
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('detailContent').style.display = 'block';
            document.getElementById('detailContent').innerHTML = `
                <div class="detail-page">
                    <div class="detail-header"><h1>Transaction</h1></div>
                    <div class="detail-grid">
                        <div class="detail-item"><label>Transaction ID</label><div class="value">${data.txid}</div></div>
                        <div class="detail-item"><label>Block Height</label><div class="value"><a href="#" onclick="showBlock(${data.block_height}); return false;">${data.block_height}</a></div></div>
                        <div class="detail-item"><label>Timestamp</label><div class="value">${data.timestamp ? new Date(data.timestamp * 1000).toLocaleString() : 'Pending'}</div></div>
                        <div class="detail-item"><label>Size</label><div class="value">${data.size || data.vsize || 0} bytes</div></div>
                        <div class="detail-item"><label>Type</label><div class="value">${data.is_coinbase ? 'Coinbase (Mining Reward)' : 'Transfer'}</div></div>
                        <div class="detail-item"><label>Total Output</label><div class="value">${data.total_output?.toFixed(8) || '0'} RET</div></div>
                    </div>
                </div>
            `;
        }

        async function showAddress(address) {
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('detailContent').style.display = 'block';
            document.getElementById('detailContent').innerHTML = '<div class="loading">Loading address data...</div>';

            const data = await fetchAPI('/api/address/' + encodeURIComponent(address));
            if (!data || data.error) {
                document.getElementById('detailContent').innerHTML = `
                    <div class="detail-page">
                        <div class="detail-header"><h1>Address</h1></div>
                        <div class="detail-grid">
                            <div class="detail-item"><label>Address</label><div class="value">${address}</div></div>
                            <div class="detail-item"><label>Status</label><div class="value">No transaction data found for this address</div></div>
                        </div>
                    </div>
                `;
                return;
            }

            const txRows = (data.transactions || []).map(tx => `
                <tr onclick="showTransaction('${tx.txid}')" style="cursor:pointer">
                    <td class="hash"><span class="hash-short">${tx.txid}</span></td>
                    <td><a href="#" onclick="event.stopPropagation(); showBlock(${tx.block_height}); return false;">${tx.block_height}</a></td>
                    <td><span class="badge ${tx.tx_type === 'received' ? 'badge-green' : 'badge-blue'}">${tx.tx_type === 'received' ? '+' : ''}${tx.net_amount?.toFixed(8) || '0'} RET</span></td>
                    <td class="time-ago">${tx.timestamp ? timeAgo(tx.timestamp) : '-'}</td>
                </tr>
            `).join('');

            document.getElementById('detailContent').innerHTML = `
                <div class="detail-page">
                    <div class="detail-header"><h1>Address Details</h1></div>
                    <div class="detail-grid">
                        <div class="detail-item" style="grid-column: 1 / -1"><label>Address</label><div class="value">${data.address}</div></div>
                        <div class="detail-item"><label>Balance</label><div class="value" style="color: #4ade80; font-size: 1.3rem;">${data.balance?.toFixed(8) || '0'} RET</div></div>
                        <div class="detail-item"><label>Total Received</label><div class="value">${data.total_received?.toFixed(8) || '0'} RET</div></div>
                        <div class="detail-item"><label>Total Spent</label><div class="value">${data.total_spent?.toFixed(8) || '0'} RET</div></div>
                        <div class="detail-item"><label>Transactions</label><div class="value">${data.tx_count || 0}</div></div>
                    </div>
                    <div class="section" style="margin-top:20px">
                        <div class="section-header"><h2>Transaction History</h2></div>
                        <table>
                            <thead><tr><th>TxID</th><th>Block</th><th>Amount</th><th>Time</th></tr></thead>
                            <tbody>
                                ${txRows || '<tr><td colspan="4" class="loading">No transactions found</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function showHome() {
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('detailContent').style.display = 'none';
            loadStats();
            loadBlocks();
            loadNodes();
        }

        function showRegisterNode() {
            const host = prompt('Enter node host (IP or domain):');
            if (!host) return;
            const port = prompt('Enter RPC port:', '18332');
            if (!port) return;
            const user = prompt('Enter RPC username (optional):');
            const pass = user ? prompt('Enter RPC password:') : '';

            fetch('/api/nodes/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({host, port: parseInt(port), rpc_user: user, rpc_pass: pass})
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    alert('Node registered! Active: ' + data.active);
                    loadNodes();
                } else {
                    alert('Error: ' + (data.error || 'Unknown'));
                }
            });
        }

        document.getElementById('searchInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') search();
        });

        // Handle URL hash routing (e.g., #block-2608)
        function handleHashRoute() {
            const hash = window.location.hash;
            if (hash.startsWith('#block-')) {
                const height = hash.replace('#block-', '');
                if (height && !isNaN(height)) {
                    showBlock(parseInt(height));
                }
            }
        }

        // Initial load
        loadStats();
        loadBlocks();
        loadNodes();

        // Check URL hash on page load
        handleHashRoute();
        window.addEventListener('hashchange', handleHashRoute);

        // Auto refresh
        setInterval(() => {
            loadStats();
            loadBlocks();
        }, 30000);
    </script>
</body>
</html>
