<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retardio Wallet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .wallet-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        .status-dot.disconnected {
            background: #f44336;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .balance-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .balance-label {
            color: #999;
            font-size: 1.1em;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .balance-amount {
            color: #667eea;
            font-size: 4em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .balance-usd {
            color: #999;
            font-size: 1.3em;
        }

        .actions-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .action-btn {
            padding: 30px;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .action-btn.send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .action-btn.receive {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .action-btn.mine {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .action-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .transaction-section {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .section-title {
            color: #667eea;
            font-size: 1.8em;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .transaction-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .transaction-item {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }

        .transaction-item:hover {
            background: #f5f5f5;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-type {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .transaction-type.received {
            color: #4CAF50;
        }

        .transaction-type.sent {
            color: #f44336;
        }

        .transaction-address {
            color: #999;
            font-size: 0.9em;
            font-family: monospace;
        }

        .transaction-amount {
            font-size: 1.5em;
            font-weight: bold;
        }

        .transaction-amount.received {
            color: #4CAF50;
        }

        .transaction-amount.sent {
            color: #f44336;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            color: #666;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            width: 100%;
            padding: 15px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .address-display {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            font-family: monospace;
            word-break: break-all;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .copy-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .stat-label {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .stat-value {
            color: #333;
            font-size: 1.8em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="wallet-container">
        <div class="header">
            <h1>💰 Retardio Wallet</h1>
            <div class="connection-status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connected</span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Block Height</div>
                <div class="stat-value" id="blockHeight">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="pendingBalance">0 RET</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Connections</div>
                <div class="stat-value" id="connections">0</div>
            </div>
        </div>

        <div class="main-grid">
            <div class="balance-card">
                <div class="balance-label">Total Balance</div>
                <div class="balance-amount" id="totalBalance">0.00</div>
                <div class="balance-usd">RET</div>
            </div>

            <div class="actions-card">
                <div class="action-buttons">
                    <button class="action-btn send" onclick="openSendModal()">
                        📤<br>Send
                    </button>
                    <button class="action-btn receive" onclick="openReceiveModal()">
                        📥<br>Receive
                    </button>
                    <button class="action-btn mine" onclick="openMineModal()">
                        ⛏️<br>Mine
                    </button>
                </div>
                <div id="actionMessage"></div>
            </div>
        </div>

        <div class="transaction-section">
            <h2 class="section-title">Recent Transactions</h2>
            <div class="transaction-list" id="transactionList">
                <div class="loading">Loading transactions...</div>
            </div>
        </div>
    </div>

    <!-- Send Modal -->
    <div class="modal" id="sendModal">
        <div class="modal-content">
            <h2 class="modal-title">Send Retardio</h2>
            <div class="form-group">
                <label class="form-label">Recipient Address</label>
                <input type="text" class="form-input" id="sendAddress" placeholder="Enter Retardio address...">
            </div>
            <div class="form-group">
                <label class="form-label">Amount (RET)</label>
                <input type="number" class="form-input" id="sendAmount" placeholder="0.00" step="0.00000001">
            </div>
            <button class="btn-primary" onclick="sendTransaction()">Send Retardio</button>
            <button class="btn-secondary" onclick="closeModal('sendModal')">Cancel</button>
            <div id="sendError"></div>
        </div>
    </div>

    <!-- Receive Modal -->
    <div class="modal" id="receiveModal">
        <div class="modal-content">
            <h2 class="modal-title">Receive Retardio</h2>
            <p class="form-label">Your Retardio Address:</p>
            <div class="address-display" id="receiveAddress">Loading...</div>
            <button class="copy-btn" onclick="copyAddress()">Copy Address</button>
            <button class="btn-secondary" onclick="closeModal('receiveModal')">Close</button>
            <div id="receiveMessage"></div>
        </div>
    </div>

    <!-- Mine Modal -->
    <div class="modal" id="mineModal">
        <div class="modal-content">
            <h2 class="modal-title">Mine Blocks</h2>
            <div class="form-group">
                <label class="form-label">Number of Blocks</label>
                <input type="number" class="form-input" id="mineBlocks" value="1" min="1" max="1000">
            </div>
            <button class="btn-primary" onclick="mineBlocks()">Start Mining</button>
            <button class="btn-secondary" onclick="closeModal('mineModal')">Cancel</button>
            <div id="mineStatus"></div>
        </div>
    </div>

    <script>
        const RPC_URL = 'http://127.0.0.1:18332';
        let currentAddress = '';

        async function rpcCall(method, params = []) {
            try {
                const response = await fetch(RPC_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '1.0',
                        id: 'wallet',
                        method: method,
                        params: params
                    })
                });

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error.message);
                }
                return data.result;
            } catch (error) {
                console.error('RPC Error:', error);
                updateConnectionStatus(false);
                throw error;
            }
        }

        async function loadBalance() {
            try {
                const balance = await rpcCall('getbalance');
                document.getElementById('totalBalance').textContent = balance.toFixed(8);

                const unconfirmed = await rpcCall('getunconfirmedbalance');
                document.getElementById('pendingBalance').textContent = unconfirmed.toFixed(8) + ' RET';

                updateConnectionStatus(true);
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        async function loadStats() {
            try {
                const info = await rpcCall('getblockchaininfo');
                document.getElementById('blockHeight').textContent = info.blocks.toLocaleString();

                const connections = await rpcCall('getconnectioncount');
                document.getElementById('connections').textContent = connections;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadTransactions() {
            try {
                const transactions = await rpcCall('listtransactions', ['*', 20]);
                const listEl = document.getElementById('transactionList');

                if (transactions.length === 0) {
                    listEl.innerHTML = '<div class="loading">No transactions yet</div>';
                    return;
                }

                listEl.innerHTML = '';
                transactions.reverse().forEach(tx => {
                    const isReceived = tx.category === 'receive' || tx.category === 'generate' || tx.category === 'immature';
                    const item = document.createElement('div');
                    item.className = 'transaction-item';
                    item.innerHTML = `
                        <div class="transaction-info">
                            <div class="transaction-type ${isReceived ? 'received' : 'sent'}">
                                ${tx.category.toUpperCase()}
                            </div>
                            <div class="transaction-address">${tx.address || 'Mining Reward'}</div>
                        </div>
                        <div class="transaction-amount ${isReceived ? 'received' : 'sent'}">
                            ${isReceived ? '+' : ''}${tx.amount.toFixed(8)} RET
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            } catch (error) {
                console.error('Error loading transactions:', error);
            }
        }

        async function openSendModal() {
            document.getElementById('sendModal').classList.add('active');
        }

        async function openReceiveModal() {
            document.getElementById('receiveModal').classList.add('active');
            try {
                if (!currentAddress) {
                    currentAddress = await rpcCall('getnewaddress');
                }
                document.getElementById('receiveAddress').textContent = currentAddress;
            } catch (error) {
                document.getElementById('receiveAddress').textContent = 'Error loading address';
            }
        }

        async function openMineModal() {
            document.getElementById('mineModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        async function sendTransaction() {
            const address = document.getElementById('sendAddress').value;
            const amount = parseFloat(document.getElementById('sendAmount').value);
            const errorEl = document.getElementById('sendError');

            errorEl.innerHTML = '';

            if (!address || !amount) {
                errorEl.innerHTML = '<div class="error">Please fill in all fields</div>';
                return;
            }

            try {
                const txid = await rpcCall('sendtoaddress', [address, amount]);
                errorEl.innerHTML = `<div class="success">Transaction sent!<br>TXID: ${txid}</div>`;
                setTimeout(() => {
                    closeModal('sendModal');
                    loadBalance();
                    loadTransactions();
                }, 2000);
            } catch (error) {
                errorEl.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function mineBlocks() {
            const blocks = parseInt(document.getElementById('mineBlocks').value);
            const statusEl = document.getElementById('mineStatus');

            statusEl.innerHTML = '<div class="loading">Mining... Please wait</div>';

            try {
                const address = await rpcCall('getnewaddress');
                await rpcCall('generatetoaddress', [blocks, address]);
                statusEl.innerHTML = `<div class="success">Successfully mined ${blocks} blocks!</div>`;
                setTimeout(() => {
                    closeModal('mineModal');
                    loadBalance();
                    loadStats();
                    loadTransactions();
                }, 2000);
            } catch (error) {
                statusEl.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function copyAddress() {
            const address = document.getElementById('receiveAddress').textContent;
            navigator.clipboard.writeText(address);
            document.getElementById('receiveMessage').innerHTML = '<div class="success">Address copied!</div>';
            setTimeout(() => {
                document.getElementById('receiveMessage').innerHTML = '';
            }, 2000);
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (connected) {
                dot.classList.remove('disconnected');
                text.textContent = 'Connected';
            } else {
                dot.classList.add('disconnected');
                text.textContent = 'Disconnected';
            }
        }

        // Load data on start
        loadBalance();
        loadStats();
        loadTransactions();

        // Refresh every 10 seconds
        setInterval(() => {
            loadBalance();
            loadStats();
            loadTransactions();
        }, 10000);
    </script>
</body>
</html>
