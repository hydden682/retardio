<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retardio Wallet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #131920;
            --bg-card: #1a2129;
            --baja: #00d4aa;
            --baja-dark: #00a88a;
            --baja-glow: rgba(0, 212, 170, 0.3);
            --text-primary: #e6edf3;
            --text-secondary: #7d8590;
            --border: #30363d;
            --red: #f85149;
            --green: #3fb950;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--baja);
            letter-spacing: -0.5px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--red);
        }

        .status-dot.connected {
            background: var(--green);
            box-shadow: 0 0 10px var(--green);
        }

        .balance-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .balance-amount {
            font-size: 3rem;
            font-weight: 700;
            color: var(--baja);
            margin-bottom: 5px;
        }

        .balance-usd {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .stat-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .action-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .action-btn:hover {
            border-color: var(--baja);
            background: var(--bg-secondary);
            box-shadow: 0 0 20px var(--baja-glow);
        }

        .action-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--baja);
        }

        .action-btn span {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .tx-list {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .tx-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        .tx-item:last-child { border-bottom: none; }
        .tx-item:hover { background: var(--bg-secondary); }

        .tx-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tx-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tx-icon.receive { background: rgba(0, 212, 170, 0.15); }
        .tx-icon.send { background: rgba(248, 81, 73, 0.15); }
        .tx-icon.mine { background: rgba(255, 200, 0, 0.15); }

        .tx-icon svg { width: 20px; height: 20px; }
        .tx-icon.receive svg { stroke: var(--baja); }
        .tx-icon.send svg { stroke: var(--red); }
        .tx-icon.mine svg { stroke: #ffc800; }

        .tx-info h4 {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .tx-info p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .tx-amount { text-align: right; }

        .tx-amount .amount {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .tx-amount .amount.positive { color: var(--baja); }
        .tx-amount .amount.negative { color: var(--red); }

        .tx-amount .time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
        }

        .modal h2 {
            font-size: 1.25rem;
            margin-bottom: 20px;
            color: var(--baja);
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--baja);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: var(--baja);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            background: var(--baja-dark);
            box-shadow: 0 0 20px var(--baja-glow);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-secondary:hover { border-color: var(--text-secondary); }

        .address-display {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.85rem;
            margin-bottom: 16px;
            color: var(--baja);
        }

        .copy-btn {
            width: 100%;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .copy-btn:hover { border-color: var(--baja); }

        .mine-info {
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .mine-input input {
            width: 100%;
            padding: 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">RETARDIO</div>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </header>

        <div class="balance-card">
            <div class="balance-label">Total Balance</div>
            <div class="balance-amount" id="balance">0.00</div>
            <div class="balance-usd">RET</div>
        </div>

        <div class="stats-row">
            <div class="stat-item">
                <div class="stat-value" id="blockHeight">-</div>
                <div class="stat-label">Block</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="pending">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="peers">0</div>
                <div class="stat-label">Peers</div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn" onclick="openSend()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11l5-5m0 0l5 5m-5-5v12"/></svg>
                <span>Send</span>
            </button>
            <button class="action-btn" onclick="openReceive()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 13l-5 5m0 0l-5-5m5 5V6"/></svg>
                <span>Receive</span>
            </button>
            <button class="action-btn" onclick="openMine()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                <span>Mine</span>
            </button>
        </div>

        <div class="section-header">
            <h3 class="section-title">Recent Activity</h3>
        </div>

        <div class="tx-list" id="txList">
            <div class="empty-state">No transactions yet</div>
        </div>
    </div>

    <!-- Send Modal -->
    <div class="modal-overlay" id="sendModal">
        <div class="modal">
            <h2>Send RET</h2>
            <div class="form-group">
                <label>Recipient Address</label>
                <input type="text" id="sendAddress" placeholder="Enter address...">
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="sendAmount" placeholder="0.00" step="0.00000001">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
                <button class="btn btn-primary" onclick="sendTransaction()">Send</button>
            </div>
        </div>
    </div>

    <!-- Receive Modal -->
    <div class="modal-overlay" id="receiveModal">
        <div class="modal">
            <h2>Receive RET</h2>
            <div class="address-display" id="receiveAddress">Loading...</div>
            <button class="copy-btn" onclick="copyAddress()">Copy Address</button>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModals()">Close</button>
            </div>
        </div>
    </div>

    <!-- Mine Modal -->
    <div class="modal-overlay" id="mineModal">
        <div class="modal">
            <h2>Mine Blocks</h2>
            <p class="mine-info">Generate blocks to your wallet</p>
            <div class="mine-input">
                <input type="number" id="mineBlocks" value="1" min="1" max="100">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
                <button class="btn btn-primary" onclick="mineBlocks()">Mine</button>
            </div>
        </div>
    </div>

    <script>
        const RPC_URL = 'http://127.0.0.1:18332';
        const RPC_USER = 'retardio';
        const RPC_PASS = 'retardiopass123';

        let connected = false;
        let myAddress = '';

        async function rpc(method, params = []) {
            try {
                const res = await fetch(RPC_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Basic ' + btoa(RPC_USER + ':' + RPC_PASS)
                    },
                    body: JSON.stringify({ jsonrpc: '1.0', id: 'wallet', method, params })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);
                return data.result;
            } catch (e) {
                console.error('RPC Error:', e);
                return null;
            }
        }

        async function updateStatus() {
            const info = await rpc('getblockchaininfo');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (info) {
                connected = true;
                dot.classList.add('connected');
                text.textContent = 'Connected';
                document.getElementById('blockHeight').textContent = info.blocks;

                const netInfo = await rpc('getnetworkinfo');
                if (netInfo) document.getElementById('peers').textContent = netInfo.connections || 0;

                const balance = await rpc('getbalance');
                if (balance !== null) document.getElementById('balance').textContent = balance.toFixed(2);

                const unconfirmed = await rpc('getunconfirmedbalance');
                if (unconfirmed !== null) document.getElementById('pending').textContent = unconfirmed.toFixed(2);

                loadTransactions();
            } else {
                connected = false;
                dot.classList.remove('connected');
                text.textContent = 'Disconnected';
            }
        }

        async function loadTransactions() {
            const txs = await rpc('listtransactions', ['*', 10]);
            const list = document.getElementById('txList');

            if (!txs || txs.length === 0) {
                list.innerHTML = '<div class="empty-state">No transactions yet</div>';
                return;
            }

            list.innerHTML = txs.reverse().map(tx => {
                const isReceive = tx.category === 'receive' || tx.category === 'generate' || tx.category === 'immature';
                const isMine = tx.category === 'generate' || tx.category === 'immature';
                const icon = isMine ? 'mine' : (isReceive ? 'receive' : 'send');
                const label = isMine ? 'Mined' : (isReceive ? 'Received' : 'Sent');
                const amountClass = isReceive ? 'positive' : 'negative';
                const sign = isReceive ? '+' : '-';
                const time = new Date(tx.time * 1000).toLocaleString();

                return `
                    <div class="tx-item">
                        <div class="tx-left">
                            <div class="tx-icon ${icon}">
                                ${isMine ? '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>' :
                                  isReceive ? '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 13l-5 5m0 0l-5-5m5 5V6"/></svg>' :
                                  '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11l5-5m0 0l5 5m-5-5v12"/></svg>'}
                            </div>
                            <div class="tx-info">
                                <h4>${label}</h4>
                                <p>${tx.confirmations} conf</p>
                            </div>
                        </div>
                        <div class="tx-amount">
                            <div class="amount ${amountClass}">${sign}${Math.abs(tx.amount).toFixed(4)}</div>
                            <div class="time">${time}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openSend() { document.getElementById('sendModal').classList.add('active'); }
        function openMine() { document.getElementById('mineModal').classList.add('active'); }

        async function openReceive() {
            document.getElementById('receiveModal').classList.add('active');
            if (!myAddress) myAddress = await rpc('getnewaddress');
            document.getElementById('receiveAddress').textContent = myAddress || 'Error';
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
        }

        function copyAddress() {
            navigator.clipboard.writeText(myAddress);
            alert('Copied!');
        }

        async function sendTransaction() {
            const address = document.getElementById('sendAddress').value;
            const amount = parseFloat(document.getElementById('sendAmount').value);
            if (!address || !amount) { alert('Fill all fields'); return; }

            const result = await rpc('sendtoaddress', [address, amount]);
            if (result) {
                alert('Sent! TxID: ' + result);
                closeModals();
                updateStatus();
            } else {
                alert('Failed');
            }
        }

        async function mineBlocks() {
            const blocks = parseInt(document.getElementById('mineBlocks').value) || 1;
            if (!myAddress) myAddress = await rpc('getnewaddress');

            const result = await rpc('generatetoaddress', [blocks, myAddress]);
            if (result) {
                alert('Mined ' + result.length + ' block(s)!');
                closeModals();
                updateStatus();
            } else {
                alert('Mining failed');
            }
        }

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModals(); });
        });

        updateStatus();
        setInterval(updateStatus, 10000);
    </script>
</body>
</html>
